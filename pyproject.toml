[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim"
version = "0.1.0"
description = "WebSocket telemetry simulator. Black-box dependency for the SpecKit workshop."
requires-python = ">=3.11"
dependencies = [
    "websockets",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
